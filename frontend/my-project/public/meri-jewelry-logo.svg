<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" fill="none">
  <defs>
    <linearGradient id="roseGold" x1="0" y1="0" x2="320" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E8B4A0"/>
      <stop offset="50%" stop-color="#C8787A"/>
      <stop offset="100%" stop-color="#A0545A"/>
    </linearGradient>
    <linearGradient id="goldRing" x1="0" y1="0" x2="320" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E4C98A"/>
      <stop offset="100%" stop-color="#C9A96E"/>
    </linearGradient>
  </defs>

  <!-- Outer gold circle ring -->
  <circle cx="160" cy="60" r="56" stroke="url(#goldRing)" stroke-width="1.2" fill="none" opacity="0.7"/>
  <circle cx="160" cy="60" r="53" stroke="url(#goldRing)" stroke-width="0.5" fill="none" opacity="0.4"/>

  <!-- Decorative floral dots top -->
  <circle cx="160" cy="6" r="2.5" fill="url(#goldRing)" opacity="0.8"/>
  <circle cx="148" cy="9"  r="1.5" fill="url(#roseGold)" opacity="0.6"/>
  <circle cx="172" cy="9"  r="1.5" fill="url(#roseGold)" opacity="0.6"/>

  <!-- Small leaf lines top-left -->
  <path d="M110 28 Q105 22 100 20" stroke="url(#roseGold)" stroke-width="1" fill="none" opacity="0.6"/>
  <path d="M108 33 Q101 27 96 26" stroke="url(#roseGold)" stroke-width="0.8" fill="none" opacity="0.5"/>
  <path d="M113 24 Q109 16 107 12" stroke="url(#roseGold)" stroke-width="0.8" fill="none" opacity="0.5"/>

  <!-- Small leaf lines top-right -->
  <path d="M210 28 Q215 22 220 20" stroke="url(#roseGold)" stroke-width="1" fill="none" opacity="0.6"/>
  <path d="M212 33 Q219 27 224 26" stroke="url(#roseGold)" stroke-width="0.8" fill="none" opacity="0.5"/>
  <path d="M207 24 Q211 16 213 12" stroke="url(#roseGold)" stroke-width="0.8" fill="none" opacity="0.5"/>

  <!-- Diamond sparkle top center -->
  <path d="M160 14 L162 18 L166 18 L163 21 L164 25 L160 22 L156 25 L157 21 L154 18 L158 18 Z" fill="url(#goldRing)" opacity="0.85"/>

  <!-- "Meri" script text -->
  <text x="160" y="62"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="38"
    font-style="italic"
    font-weight="400"
    text-anchor="middle"
    fill="url(#roseGold)"
    letter-spacing="-1">Meri</text>

  <!-- "JEWELRY" caps text -->
  <text x="160" y="78"
    font-family="'Arial', 'Helvetica Neue', sans-serif"
    font-size="11"
    font-weight="700"
    text-anchor="middle"
    fill="url(#roseGold)"
    letter-spacing="5">JEWELRY</text>

  <!-- Necklace pendant bottom -->
  <path d="M155 86 Q160 83 165 86" stroke="url(#goldRing)" stroke-width="1.2" fill="none"/>
  <line x1="160" y1="86" x2="160" y2="94" stroke="url(#goldRing)" stroke-width="1"/>
  <ellipse cx="160" cy="97" rx="4" ry="5.5" fill="none" stroke="url(#goldRing)" stroke-width="1.2"/>
  <ellipse cx="160" cy="97" rx="2" ry="3.5" fill="url(#goldRing)" opacity="0.5"/>

  <!-- Bottom leaf lines left -->
  <path d="M112 88 Q106 94 103 98" stroke="url(#roseGold)" stroke-width="1" fill="none" opacity="0.5"/>
  <path d="M116 92 Q109 97 107 102" stroke="url(#roseGold)" stroke-width="0.8" fill="none" opacity="0.4"/>

  <!-- Bottom leaf lines right -->
  <path d="M208 88 Q214 94 217 98" stroke="url(#roseGold)" stroke-width="1" fill="none" opacity="0.5"/>
  <path d="M204 92 Q211 97 213 102" stroke="url(#roseGold)" stroke-width="0.8" fill="none" opacity="0.4"/>

  <!-- Small gold dots scattered -->
  <circle cx="130" cy="42" r="1"   fill="url(#goldRing)" opacity="0.5"/>
  <circle cx="192" cy="38" r="1"   fill="url(#goldRing)" opacity="0.5"/>
  <circle cx="122" cy="72" r="0.8" fill="url(#goldRing)" opacity="0.4"/>
  <circle cx="198" cy="75" r="0.8" fill="url(#goldRing)" opacity="0.4"/>
  <circle cx="140" cy="25" r="1.2" fill="url(#roseGold)" opacity="0.4"/>
  <circle cx="180" cy="22" r="1.2" fill="url(#roseGold)" opacity="0.4"/>
</svg>
