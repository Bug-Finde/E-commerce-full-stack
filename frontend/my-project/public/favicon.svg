<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#E4C98A"/>
      <stop offset="50%"  stop-color="#C9A96E"/>
      <stop offset="100%" stop-color="#A07840"/>
    </linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#E8B4A0"/>
      <stop offset="100%" stop-color="#C8787A"/>
    </linearGradient>
  </defs>

  <!-- Ivory background circle -->
  <circle cx="32" cy="32" r="31" fill="#FAF8F5"/>

  <!-- Outer gold ring -->
  <circle cx="32" cy="32" r="29" stroke="url(#gold)" stroke-width="1.2" fill="none" opacity="0.8"/>
  <circle cx="32" cy="32" r="27" stroke="url(#gold)" stroke-width="0.5" fill="none" opacity="0.4"/>

  <!-- Top diamond sparkle -->
  <path d="M32 5 L33.2 8 L36.4 8 L33.9 10 L34.8 13.2 L32 11.4 L29.2 13.2 L30.1 10 L27.6 8 L30.8 8 Z"
        fill="url(#gold)" opacity="0.9"/>

  <!-- Decorative top dots -->
  <circle cx="24" cy="7.5" r="1.2" fill="url(#rose)" opacity="0.7"/>
  <circle cx="40" cy="7.5" r="1.2" fill="url(#rose)" opacity="0.7"/>

  <!-- "M" letter — italic serif style, centered -->
  <text x="32" y="38"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="26"
    font-style="italic"
    font-weight="400"
    text-anchor="middle"
    fill="url(#rose)">M</text>

  <!-- Bottom pendant chain -->
  <path d="M28 47 Q32 44.5 36 47" stroke="url(#gold)" stroke-width="1.1" fill="none"/>
  <line x1="32" y1="47" x2="32" y2="52" stroke="url(#gold)" stroke-width="0.9"/>
  <!-- Teardrop gem -->
  <ellipse cx="32" cy="55" rx="2.8" ry="3.8" fill="none" stroke="url(#gold)" stroke-width="1.1"/>
  <ellipse cx="32" cy="55" rx="1.4" ry="2.2" fill="url(#gold)" opacity="0.5"/>

  <!-- Bottom decorative dots -->
  <circle cx="23" cy="55" r="1"   fill="url(#rose)" opacity="0.5"/>
  <circle cx="41" cy="55" r="1"   fill="url(#rose)" opacity="0.5"/>

  <!-- Side accent dots -->
  <circle cx="5"  cy="32" r="1.2" fill="url(#gold)" opacity="0.5"/>
  <circle cx="59" cy="32" r="1.2" fill="url(#gold)" opacity="0.5"/>
</svg>
